document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1c1a17;color:#fff;border-radius:4px;text-decoration:none}\n.dv-tname{font:600 13px/1.2 'Public Sans',system-ui,sans-serif;color:#1c1a17}\n.dv-opts{display:flex;flex-direction:column;gap:36px;align-items:flex-start}\n.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}\n.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1c1a17;border-radius:5px;text-decoration:none}\n.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 'Public Sans',system-ui,sans-serif;color:rgba(0,0,0,.55)}\n.dv-card{max-width:100%;background:#fffdf9;border:1px solid rgba(0,0,0,.1);border-radius:10px;box-shadow:0 6px 22px rgba(28,26,23,.13);overflow:hidden}\n.dv-opt:target .dv-oid{background:#0f5c58;color:#fff}\n.dv-next{margin:22px 0 0;font:12px/1.5 'Public Sans',system-ui,sans-serif;color:rgba(0,0,0,.5)}\n@keyframes barpulse{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}\n<\u002Fstyle><\u002Fhelmet>\n\n<section class=\"dv-turn\" id=\"t1\">\n<div class=\"dv-thd\"><a class=\"dv-tid\" href=\"#t1\">1<\u002Fa><span class=\"dv-tname\">Lector de texto a audio — tres direcciones de layout, resaltado y barra de reproducción<\u002Fspan><\u002Fdiv>\n<div class=\"dv-opts\">\n\n<div class=\"dv-opt\" id=\"1a\"><div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>Tres paneles clásico · macOS · barra expandida · lectura activa<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:1140px;position:relative\">\n  <div style=\"display:flex;align-items:center;height:38px;padding:0 14px;background:#efe9df;border-bottom:1px solid rgba(28,26,23,.12)\">\n    <div style=\"display:flex;gap:8px\"><span style=\"width:11px;height:11px;border-radius:50%;background:#ec6a5e\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#f4bf4f\"><\u002Fspan><span style=\"width:11px;height:11px;border-radius:50%;background:#61c454\"><\u002Fspan><\u002Fdiv>\n    <div style=\"flex:1;text-align:center;font:600 12px 'Public Sans',sans-serif;color:#6b6459\">Fotosíntesis — apuntes.pdf<\u002Fdiv>\n    <div style=\"width:52px\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;height:660px\">\n    <aside style=\"width:280px;flex:none;border-right:1px solid rgba(28,26,23,.1);background:#faf6ee;padding:18px;display:flex;flex-direction:column;gap:16px;overflow:hidden\">\n      <div style=\"font:700 11px/1 'Public Sans',sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a8175\">Entrada<\u002Fdiv>\n      <textarea placeholder=\"Pega aquí tu texto…\" style=\"width:100%;box-sizing:border-box;height:104px;resize:none;border:1px solid rgba(28,26,23,.16);border-radius:8px;padding:11px 12px;font:400 14px/1.5 'Atkinson Hyperlegible',sans-serif;color:#1c1a17;background:#fffdf9\"><\u002Ftextarea>\n      <div style=\"display:flex;gap:8px\">\n        <button style=\"flex:1;height:38px;border:0;border-radius:8px;background:#0f5c58;color:#fff;font:600 13px 'Public Sans',sans-serif;cursor:pointer\" style-hover=\"background:#0a3e3b\">Abrir PDF / HTML<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px\">\n        <input placeholder=\"https://…\" style=\"flex:1;min-width:0;height:36px;box-sizing:border-box;border:1px solid rgba(28,26,23,.16);border-radius:8px;padding:0 10px;font:400 13px 'Public Sans',sans-serif;background:#fffdf9;color:#1c1a17\">\n        <button style=\"height:36px;padding:0 12px;border:1px solid rgba(28,26,23,.18);border-radius:8px;background:#fffdf9;color:#1c1a17;font:600 13px 'Public Sans',sans-serif;cursor:pointer\">Leer<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"border:1.5px dashed rgba(28,26,23,.22);border-radius:10px;padding:20px 14px;text-align:center;font:400 12px/1.5 'Public Sans',sans-serif;color:#8a8175;background:rgba(28,26,23,.02)\">Arrastra un PDF o HTML<br>a cualquier parte de la ventana<\u002Fdiv>\n      <div style=\"margin-top:auto;border-top:1px solid rgba(28,26,23,.1);padding-top:14px;display:flex;flex-direction:column;gap:8px\">\n        <div style=\"display:flex;justify-content:space-between;font:400 12px 'Public Sans',sans-serif;color:#6b6459\"><span>Caracteres a la API<\u002Fspan><span style=\"font-variant-numeric:tabular-nums;color:#1c1a17;font-weight:600\">{{ apiChars }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font:400 12px 'Public Sans',sans-serif;color:#6b6459\"><span>Caché de audio<\u002Fspan><span style=\"color:#1c1a17;font-weight:600\">18,4 MB<\u002Fspan><\u002Fdiv>\n        <button sc-camel-on-click=\"{{ openSettings }}\" style=\"height:34px;border:1px solid rgba(28,26,23,.18);border-radius:8px;background:transparent;color:#1c1a17;font:600 12px 'Public Sans',sans-serif;cursor:pointer\">Ajustes…<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main style=\"flex:1;min-width:0;display:flex;flex-direction:column;background:#fffdf9\">\n      <sc-if value=\"{{ showWarn }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;align-items:flex-start;gap:10px;padding:12px 22px;background:#fdf3d8;border-bottom:1px solid rgba(28,26,23,.1)\">\n        <span style=\"flex:none;width:18px;height:18px;border-radius:50%;background:#c98a12;color:#fff;font:700 12px/18px 'Public Sans',sans-serif;text-align:center\">!<\u002Fspan>\n        <p style=\"margin:0;flex:1;font:400 13px/1.5 'Public Sans',sans-serif;color:#5f4b18\">Páginas 3–7 procesadas con OCR; el texto puede contener errores.<\u002Fp>\n        <button sc-camel-on-click=\"{{ dismissWarn }}\" style=\"flex:none;border:0;background:transparent;color:#8a7a4a;font:600 12px 'Public Sans',sans-serif;cursor:pointer\">Ocultar<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:flex;align-items:baseline;gap:14px;padding:20px 22px 10px\">\n        <h1 style=\"margin:0;font:700 21px/1.25 'Public Sans',sans-serif;color:#1c1a17\">Fotosíntesis — apunte lass=\"dv-oid\" href=\"#1a\">1a<\u002Fa> pero con la barra compacta de <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>» · «lleva el resaltado por palabra de <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa> a todas» · «añade el estado vacío y drag &amp; drop»<\u002Fp>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#0f5c58&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#0f5c58&quot;,&quot;#2b4c8c&quot;,&quot;#7a3b8f&quot;,&quot;#1c1a17&quot;],&quot;section&quot;:&quot;Tema&quot;},&quot;highlight&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#f6d78a&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#f6d78a&quot;,&quot;#bfe3dd&quot;,&quot;#e8d4f0&quot;,&quot;#ffd0b8&quot;],&quot;section&quot;:&quot;Tema&quot;},&quot;showNumbers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Lista de párrafos&quot;}}\">\nconst DOC = [\n  \"La fotosíntesis es el proceso por el que las plantas, las algas y algunas bacterias transforman la energía luminosa en energía química almacenada en moléculas orgánicas.\",\n  \"Ocurre en los cloroplastos, orgánulos que contienen clorofila. Este pigmento absorbe con mayor eficacia la luz roja y la azul, y refleja la verde, de ahí el color de las hojas.\",\n  \"El proceso se divide en dos fases. La fase luminosa, dependiente de la luz, tiene lugar en la membrana de los tilacoides y produce ATP y NADPH mientras libera oxígeno a partir del agua.\",\n  \"La fase oscura, o ciclo de Calvin, ocurre en el estroma y no necesita luz de forma directa. Utiliza el ATP y el NADPH de la fase anterior para fijar dióxido de carbono en glucosa.\",\n  \"El balance global puede resumirse así: seis moléculas de dióxido de carbono y seis de agua, con energía luminosa, dan una molécula de glucosa y seis de oxígeno.\",\n  \"La intensidad de la luz, la concentración de dióxido de carbono y la temperatura son los tres factores que limitan la velocidad del proceso en condiciones naturales.\",\n];\nconst DOC_B = [\n  [\"Informe anual de sostenibilidad — resumen ejecutivo del ejercicio 2025 presentado ante el consejo.\", \"pág. 1 · texto\"],\n  [\"El consumo energético total descendió un 12 % respecto al ejercicio anterior, con una reducción del 19 % en las plantas de la región norte.\", \"pág. 2 · texto\"],\n  [\"Las emisiones de alcance 1 y 2 se calcularon siguiendo el protocolo GHG. Los datos de alcance 3 siguen siendo estimaciones parciales.\", \"pág. 3 · OCR\"],\n  [\"La inversión en eficiencia ascendió a 4,2 millones de euros, concentrada en climatización y en la renovación de la flota ligera.\", \"pág. 4 · OCR\"],\n  [\"El programa de formación interna alcanzó a 1 340 empleados, con una valoración media de 4,3 sobre 5 en las encuestas de salida.\", \"pág. 5 · OCR\"],\n  [\"Los objetivos para 2026 incluyen cerrar la medición de alcance 3 y auditar externamente el inventario completo de emisiones.\", \"pág. 6 · OCR\"],\n];\nconst VOICES = {\n  system: [\"Mónica (es-ES)\", \"Paulina (es-MX)\", \"Jorge (es-ES)\"],\n  elevenlabs: [\"Valentina · multilingual v2\", \"Mateo · multilingual v2\", \"Lucía · turbo\"],\n  openai: [\"nova\", \"onyx\", \"shimmer\"],\n};\n\nclass Component extends DCLogic {\n  state = {\n    a: { i: 2, playing: true, engine: \"system\", rate: 1.1, warn: true, settings: false, chars: 12480 },\n    b: { i: 1, playing: false, engine: \"system\", rate: 1.4, offline: false, chars: 31207 },\n    c: { i: 1, playing: true, rate: 1, size: 1, focus: true },\n  };\n\n  componentDidMount() {\n    this.t = setInterval(() => {\n      this.setState(s => {\n        const n = { ...s };\n        if (s.a.playing) n.a = { ...s.a, i: (s.a.i + 1) % DOC.length };\n        if (s.c.playing) n.c = { ...s.c, i: (s.c.i + 1) % DOC.length };\n        return n;\n      });\n    }, 3200);\n  }\n  componentWillUnmount() { clearInterval(this.t); }\n\n  set(k, patch) { this.setState(s => ({ [k]: { ...s[k], ...patch } })); }\n\n  accent() { return this.props.accent || \"#0f5c58\"; }\n  hi() { return this.props.highlight || \"#f6d78a\"; }\n\n  rows(list, active, opts) {\n    const acc = this.accent(), hl = this.hi(), numbers = this.props.showNumbers !== false;\n    return list.map((body, idx) => {\n      const on = idx === active;\n      return {\n        n: String(idx + 1).padStart(2, \"0\"),\n        body,\n        row: `display:flex;gap:14px;align-items:flex-start;padding:${opts.pad};margin:0 -10px;border-radius:9px;cursor:pointer;transition:background .18s;background:${on ? hl + \"66\" : \"transparent\"};box-shadow:${on ? \"inset 3px 0 0 \" + acc : \"none\"}`,\n        num: `flex:${numbers ? \"none\" : \"none\"};display:${numbers ? \"block\" : \"none\"};min-width:22px;font:600 11px/1.9 ui-monospace,Menlo,monospace;color:${on ? acc : \"#b3aa9c\"};font-variant-numeric:tabular-nums`,\n        text: `margin:0;flex:1;font:400 ${opts.size}px/1.62 'Atkinson Hyperlegible',sans-serif;color:${on ? \"#1c1a17\" : \"#4a453d\"}`,\n        onClick: () => opts.pick(idx),\n      };\n    });\n  }\n\n  renderVals() {\n    const { a, b, c } = this.state, acc = this.accent();\n    const chip = (on) => `border:1px solid ${on ? acc : \"rgba(28,26,23,.18)\"};background:${on ? acc : \"#fffdf9\"};color:${on ? \"#fff\" : \"#1c1a17\"};border-radius:7px;min-width:44px;height:32px;padding:0 9px;font:600 12px 'Public Sans',sans-serif;cursor:pointer`;\n    const sizes = [15, 19, 24];\n\n    const parasB = this.rows(DOC_B.map(d => d[0]), b.i, { pad: \"12px 10px\", size: 15, pick: i => this.set(\"b\", { i }) })\n      .map((r, idx) => ({ ...r, tag: `flex:none;font:500 10px 'Public Sans',sans-serif;color:${DOC_B[idx][1].includes(\"OCR\") ? \"#c98a12\" : \"#a49a8b\"};background:${DOC_B[idx][1].includes(\"OCR\") ? \"#fdf3d8\" : \"rgba(28,26,23,.05)\"};border-radius:5px;padding:3px 7px;white-space:nowrap;margin-top:2px`, tagText: DOC_B[idx][1] }));\n\n    const parasC = DOC.map((body, idx) => {\n      const on = idx === c.i;\n      const dim = c.focus && !on;\n      return {\n        body,\n        text: `margin:0 0 ${sizes[c.size] * 1.1}px;font:400 ${sizes[c.size]}px/1.72 'Atkinson Hyperlegible',sans-serif;cursor:pointer;transition:opacity .3s,color .2s;opacity:${dim ? .62 : 1};color:${c.focus ? (on ? \"#fffdf9\" : \"#fffdf9\") : \"#1c1a17\"};background:${on && !c.focus ? this.hi() + \"66\" : \"transparent\"};box-shadow:${on ? (c.focus ? \"inset 4px 0 0 \" + this.hi() : \"inset 3px 0 0 \" + acc) : \"none\"};padding:${on ? \"10px 0 10px 16px\" : \"10px 0 10px 16px\"};border-radius:6px`,\n        onClick: () => this.set(\"c\", { i: idx }),\n      };\n    });\n\n    return {\n      paras: this.rows(DOC, a.i, { pad: \"13px 10px\", size: 17, pick: i => this.set(\"a\", { i, playing: true }) }),\n      total: DOC.length, pos: a.i + 1,\n      playGlyph: a.playing ? \"❙❙\" : \"▶\",\n      statusLabel: a.playing ? \"Reproduciendo · \" + (a.engine === \"system\" ? \"voz del sistema\" : \"audio en caché\") : \"En pausa\",\n      progressBar: `width:${((a.i + 1) / DOC.length) * 100}%;height:100%;background:${acc};transition:width .4s`,\n      engine: a.engine, voices: VOICES[a.engine], rate: a.rate, rateLabel: a.rate.toFixed(1) + \"×\",\n      apiChars: a.chars.toLocaleString(\"es-ES\"),\n      showWarn: a.warn, settingsOpen: a.settings,\n      toggle: () => this.set(\"a\", { playing: !a.playing }),\n      prev: () => this.set(\"a\", { i: Math.max(0, a.i - 1) }),\n      next: () => this.set(\"a\", { i: Math.min(DOC.length - 1, a.i + 1) }),\n      stop: () => this.set(\"a\", { playing: false, i: 0 }),\n      setEngine: e => this.set(\"a\", { engine: e.target.value }),\n      setRate: e => this.set(\"a\", { rate: parseFloat(e.target.value) }),\n      dismissWarn: () => this.set(\"a\", { warn: false }),\n      openSettings: () => this.set(\"a\", { settings: true }),\n      closeSettings: () => this.set(\"a\", { settings: false }),\n\n      parasB, totalB: DOC_B.length, posB: b.i + 1,\n      playGlyphB: b.playing ? \"❙❙\" : \"▶\",\n      progressBarB: `width:${((b.i + 1) / DOC_B.length) * 100}%;height:100%;background:${acc}`,\n      engineB: b.engine, voicesB: VOICES[b.engine], rateB: b.rate, rateLabelB: b.rate.toFixed(1) + \"×\",\n      apiCharsB: b.chars.toLocaleString(\"es-ES\"), offlineB: b.offline,\n      toggleB: () => this.set(\"b\", { playing: !b.playing }),\n      prevB: () => this.set(\"b\", { i: Math.max(0, b.i - 1) }),\n      nextB: () => this.set(\"b\", { i: Math.min(DOC_B.length - 1, b.i + 1) }),\n      setEngineB: e => this.set(\"b\", { engine: e.target.value, offline: e.target.value !== \"system\" }),\n      setRateB: e => this.set(\"b\", { rate: parseFloat(e.target.value) }),\n      fixOffline: () => this.set(\"b\", { engine: \"system\", offline: false }),\n      pages: Array.from({ length: 42 }, (_, i) => ({\n        n: i + 1,\n        style: `display:grid;place-items:center;height:22px;border-radius:4px;font:500 10px 'Public Sans',sans-serif;font-variant-numeric:tabular-nums;background:${i < 7 ? (i === 6 ? acc : \"rgba(15,92,88,.14)\") : \"rgba(28,26,23,.05)\"};color:${i === 6 ? \"#fff\" : i < 7 ? acc : \"#7d7466\"}`,\n      })),\n\n      parasC, totalC: DOC.length, posC: c.i + 1,\n      playGlyphC: c.playing ? \"❙❙\" : \"▶\",\n      focusBg: `background:${c.focus ? \"#221f1b\" : \"#fffdf9\"};padding:0 40px;min-height:430px;transition:background .3s`,\n      focusInk: c.focus ? \"#fffdf9\" : \"#1c1a17\",\n      focusLabel: c.focus ? \"Enfoque activado\" : \"Enfoque desactivado\",\n      rateLabelC: c.rate.toFixed(1) + \"×\",\n      rateChips: [0.8, 1, 1.3, 1.6].map(r => ({ label: r.toFixed(1) + \"×\", style: chip(c.rate === r), onClick: () => this.set(\"c\", { rate: r }) })),\n      sizeChips: [\"A\", \"A\", \"A\"].map((l, i) => ({ label: l, style: chip(c.size === i) + `;font-size:${11 + i * 3}px`, onClick: () => this.set(\"c\", { size: i }) })),\n      toggleC: () => this.set(\"c\", { playing: !c.playing }),\n      prevC: () => this.set(\"c\", { i: Math.max(0, c.i - 1) }),\n      nextC: () => this.set(\"c\", { i: Math.min(DOC.length - 1, c.i + 1) }),\n      toggleFocus: () => this.set(\"c\", { focus: !c.focus }),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
