# Empaquetado (brief §3 y §8). Firma y notarización se activan solas cuando
# están presentes las variables de entorno correspondientes (ver README):
#   macOS   → CSC_LINK / CSC_KEY_PASSWORD (certificado) y
#             APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (notarizar).
#   Windows → CSC_LINK / CSC_KEY_PASSWORD (certificado de firma).
appId: com.aaroncatzim.lectoraudio
productName: Lector Audio
copyright: Copyright (c) 2026

directories:
  buildResources: build
  output: release/${version}

files:
  - out/**/*
  - package.json

# Datos de OCR (idiomas de tesseract). En ejecución: process.resourcesPath.
extraResources:
  - from: resources
    to: resources

# El binario nativo de canvas y el wasm de tesseract deben quedar fuera del asar.
asar: true
asarUnpack:
  - '**/*.node'
  - '**/node_modules/@napi-rs/canvas*/**'
  - '**/node_modules/tesseract.js/**'
  - '**/node_modules/tesseract.js-core/**'

icon: build/icon.png

# Windows: instalador NSIS.
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# macOS: DMG para Apple Silicon e Intel, runtime endurecido para poder notarizar.
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # `notarize: true` hace que electron-builder notarice cuando existan las
  # variables APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID; si no,
  # simplemente lo omite con un aviso.
  notarize: true

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

# Linux queda fuera de alcance en v1 (brief §2).
